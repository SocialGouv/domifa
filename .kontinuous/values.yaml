global:
  pgSecretName: pg-app

backend:
  ~chart: app
  ~needs: [backend-cron]
  imagePackage: backend
  host: "api-{{ .Values.global.host }}"
  probesPath: /healthz
  containerPort: 3000
  # Désactive le patch kontinuous "zero-downtime-readiness", qui impose une
  # readinessProbe `cat` sur un fichier posé au démarrage : elle réussit tant
  # que le conteneur tourne, même quand l'event loop Node est bloqué et que le
  # process ne répond plus. Le pod restait alors dans le load-balancing jusqu'à
  # ce que la livenessProbe le tue. Le drain est repris ci-dessous par preStop.
  annotations:
    kontinuous/plugin.zeroDowntimeHandled: "true"
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits: # exports need a lot of CPU/RAM ATM
      cpu: 3
      memory: 3Gi
  startupProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    failureThreshold: 50
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
    successThreshold: 1
  livenessProbe:
    failureThreshold: 20
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  lifecycle:
    preStop:
      exec:
        # Laisse le temps aux ingress de retirer le pod des endpoints avant que
        # le process reçoive SIGTERM.
        command: ["sh", "-c", "sleep 30"]
  envFrom:
    - secretRef:
        name: "{{ .Values.global.pgSecretName }}"
    - secretRef:
        name: backend-sealed-secret
    - configMapRef:
        name: backend-configmap
  vars: &backendVars
    TZ: Europe/Paris
    # L'image fixe --max-old-space-size=8192 alors que la limite du conteneur
    # est de 3Gi : V8 se croit au large et retarde ses GC. Aligné sur la limite
    # réelle, en gardant ~1Gi pour le hors-tas (natif, buffers, pdftk).
    NODE_OPTIONS: "--max-old-space-size=2048"
    POSTGRES_HOST: "$(PGHOST)"
    POSTGRES_USERNAME: "$(PGUSER)"
    POSTGRES_PASSWORD: "$(PGPASSWORD)"
    POSTGRES_DATABASE: "$(PGDATABASE)"
    POSTGRES_PORT: "$(PGPORT)"
    DOMIFA_BACKEND_URL: "https://api-{{ .Values.global.host }}/"
    DOMIFA_FRONTEND_URL: "https://{{ .Values.global.host }}/"
    DOMIFA_PORTAIL_USAGERS_URL: "https://mon-{{ .Values.global.host }}/"
    DOMIFA_PORTAIL_ADMINS_URL: "https://admin-{{ .Values.global.host }}/"
    DOMIFA_CRON_ENABLED: "false"
  securityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

backend-export:
  # duplicate keys
  ~chart: app
  ~needs: [backend-cron]
  imagePackage: backend
  host: "api-{{ .Values.global.host }}"
  probesPath: /healthz
  containerPort: 3000
  ingress:
    paths:
      - /export
      - /stats
      - /stats/home
      - /admin/structures/export
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 64m
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-keepalive-requests: "100"
      nginx.ingress.kubernetes.io/proxy-keepalive-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
  resources:
    requests:
      cpu: 0.3
      memory: 512Mi
    limits: # exports need a lot of CPU/RAM ATM
      cpu: 3
      memory: 3Gi
  startupProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    failureThreshold: 50
    periodSeconds: 10
  livenessProbe:
    failureThreshold: 20
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  envFrom:
    - secretRef:
        name: "{{ .Values.global.pgSecretName }}"
    - secretRef:
        name: backend-sealed-secret
    - configMapRef:
        name: backend-configmap
  vars: &backendVars
    TZ: Europe/Paris
    POSTGRES_HOST: "$(PGHOST)"
    POSTGRES_USERNAME: "$(PGUSER)"
    POSTGRES_PASSWORD: "$(PGPASSWORD)"
    POSTGRES_DATABASE: "$(PGDATABASE)"
    POSTGRES_PORT: "$(PGPORT)"
    DOMIFA_BACKEND_URL: "https://api-{{ .Values.global.host }}/"
    DOMIFA_FRONTEND_URL: "https://{{ .Values.global.host }}/"
    DOMIFA_PORTAIL_USAGERS_URL: "https://mon-{{ .Values.global.host }}/"
    DOMIFA_PORTAIL_ADMINS_URL: "https://admin-{{ .Values.global.host }}/"
    DOMIFA_CRON_ENABLED: "false"
  securityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

backend-cron:
  ~chart: app
  imagePackage: backend
  .ingress.enabled: false
  probesPath: /healthz
  containerPort: 3000
  resources:
    requests:
      cpu: 0.2
      memory: 256Mi
    limits:
      cpu: 1.5
      memory: 2Gi
  startupProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    failureThreshold: 100
    periodSeconds: 60
  envFrom:
    - secretRef:
        name: "{{ .Values.global.pgSecretName }}"
    - secretRef:
        name: backend-sealed-secret
    - configMapRef:
        name: backend-configmap
  vars:
    <<: *backendVars
    DOMIFA_CRON_ENABLED: "true"
    DOMIFA_SENTRY_ENABLED: "true"
    DOMIFA_SENTRY_DEBUG_MODE_ENABLED: "false"

  securityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

frontend:
  ~chart: app
  imagePackage: frontend
  host: "{{ .Values.global.host }}"
  containerPort: 8080
  # Security headers are now set by the app's nginx (packages/frontend/nginx.conf)
  # so they no longer depend on the ingress controller's custom-headers support.
  resources:
    requests:
      cpu: 0.2
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  securityContext:
    fsGroup: 101
    runAsUser: 101
    runAsGroup: 101

portail-admins:
  ~chart: app
  imagePackage: portail-admins
  host: "admin-{{ .Values.global.host }}"
  # Security headers are now set by the app's nginx (packages/portail-admins/nginx.conf).
  containerPort: 8080
  securityContext:
    fsGroup: 101
    runAsUser: 101
    runAsGroup: 101

portail-usagers:
  ~chart: app
  imagePackage: portail-usagers
  host: "mon-{{ .Values.global.host }}"
  # Security headers are now set by the app's nginx (packages/portail-usagers/nginx.conf).
  containerPort: 8080
  securityContext:
    fsGroup: 101
    runAsUser: 101
    runAsGroup: 101
