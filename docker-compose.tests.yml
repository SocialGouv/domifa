version: "3.4"

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: domifa-postgres
    volumes:
      - ./_scripts/docker/postgres-restore-test-dump.docker-entrypoint.sh:/docker-entrypoint-initdb.d/postgres-restore-dump.docker-entrypoint.sh
      - ./_scripts:/app/_scripts:delegated
    ports:
      - "5432:5432"
    environment:
      TZ: "Europe/Paris"
      POSTGRES_DB: domifa_test
      POSTGRES_USER: domifa_user
      POSTGRES_PASSWORD: xxxxxxxxxxxxxxxxxxx
      POSTGRES_SSL: "false"
    env_file: ./.env.dev.example.env
    healthcheck:
      retries: 5
      timeout: 5s
      interval: 5s
      start_period: 2s
      test: ["CMD-SHELL", "pg_isready -U domifa_user"]

  # Bundled signatures only: no download, EICAR is always included
  clamav:
    image: clamav/clamav-debian:1.4.3
    container_name: domifa-clamav-tests
    ports:
      - "127.0.0.1:3310:3310"
    environment:
      TZ: Europe/Paris
      CLAMAV_NO_FRESHCLAMD: "true"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
