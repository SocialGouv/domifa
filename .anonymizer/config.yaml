log:
  level: debug
  format: text

storage:
  type: "{{type}}"
  directory:
    path: "{{tmp}}"
  s3:
    endpoint: "{{bucket_endpoint}}"
    bucket: "{{bucket_name}}"
    region: "{{bucket_region}}"
    access_key_id: "{{bucket_access_key}}"
    secret_access_key: "{{bucket_secret_key}}"
    prefix: "/anonymizer/pg_dumps"
    # force_path_style: true

# One `Cmd` block per table at most: each spawns a node process and round-trips
# every row through it.
dump:
  transformation:
    - schema: public
      name: usager
      transformers:
        - name: "Template"
          params:
            column: "email"
            template: |
              {{ printf "user-%s@domifa-fake.fabrique.social.gouv.fr" (fakerUUID) }}
        - name: RandomPerson
          params:
            columns:
              - name: prenom
                template: "{{ .FirstName }}"
              - name: nom
                template: "{{ .LastName }}"
        - name: RandomPerson
          params:
            columns:
              - name: nom_prenom_surnom_ref
                template: "{{ .LastName }}"
        - name: RandomPerson
          params:
            columns:
              - name: surnom
                template: "{{ .LastName }}"
        - name: Json
          params:
            column: telephone
            operations:
              - operation: set
                path: countryCode
                value: fr
              - operation: set
                path: numero
                value: ""
        - name: SetNull
          params:
            column: pinnedNote
        - name: RealAddress
          params:
            columns:
              - name: villeNaissance
                template: "{{.City}}"
        - name: Json
          params:
            column: decision
            operations:
              - operation: set
                path: motifDetails
                value: null
              - operation: set
                path: orientationDetails
                value: null
              - operation: set
                path: userName
                value_template: "{{ quote fakerName }}"
              - operation: set
                path: userId
                value_template: "{{ randomInt 0 1000000000}}"
              - operation: set
                path: uuid
                value_template: "{{ quote fakerUUID }}"
        - name: Replace
          params:
            column: migrated
            value: true
            keep_null: false
        - name: SetNull
          params:
            column: langue
        - name: SetNull
          params:
            column: nationalite
        - name: SetNull
          params:
            column: customRef
        - name: SetNull
          params:
            column: numeroDistribution
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/usager--all-columns.js"
            columns:
              - name: "historique"
                skip_on_null_input: true
              - name: "ayantsDroits"
                skip_on_null_input: true
              - name: "import"
                skip_on_null_input: true
              - name: "rdv"
                skip_on_null_input: true
              - name: "options"
                skip_on_null_input: true
              - name: "dateNaissance"
                skip_on_null_input: true

    - schema: public
      name: usager_history_states
      # Stats projection already stripped by dataCleanerForStats.service.ts.
      transformers:
        - name: SetNull
          params:
            column: nationalite
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/usager-history-states--dates.js"
            columns:
              - name: "dateNaissance"
                skip_on_null_input: true
              - name: "ayantsDroits"
                skip_on_null_input: true

    - schema: public
      name: structure
      transformers:
        - name: SetNull
          params:
            column: hardReset
        - name: "Template"
          params:
            column: "email"
            template: |
              {{ printf "structure-%s@domifa-fake.fabrique.social.gouv.fr" (fakerUUID) }}
        - name: Json
          params:
            column: telephone
            operations:
              - operation: set
                path: countryCode
                value: "fr"
              - operation: set
                path: numero
                value: "0600000000"
        - name: SetNull
          params:
            column: organismeTypeDetail
        - name: SetNull
          params:
            column: reseauDetail
        - name: RandomCompany
          params:
            columns:
              - name: nom
                template: "{{ .CompanyName }}"
        - name: RealAddress
          params:
            columns:
              - name: adresse
                template: "{{ .Address }}"
        - name: SetNull
          params:
            column: complementAdresse
        - name: RandomString
          params:
            column: siret
            min_length: 14
            max_length: 14
            symbols: "0123456789"
        - name: RandomString
          params:
            column: agrement
            min_length: 10
            max_length: 10
            symbols: "0123456789"
        - name: RandomFloat
          params:
            column: latitude
            min: 41.3
            max: 51.1
            decimal: 6
        - name: RandomFloat
          params:
            column: longitude
            min: -5.2
            max: 9.6
            decimal: 6
        - name: Json
          params:
            column: adresseCourrier
            operations:
              - operation: set
                path: adresse
                value_template: "{{ quote fakerRealAddress.Address }}"
        - name: Json
          params:
            column: responsable
            operations:
              - operation: set
                path: nom
                value_template: "{{ quote fakerFirstLastName }}"
              - operation: set
                path: prenom
                value_template: "{{ quote fakerFirstName }}"
              - operation: set
                path: fonction
                value_template: "{{ quote fakerWord }}"
        - name: Json
          params:
            column: decision
            operations:
              - operation: set
                path: motifDetails
                value: null
              - operation: set
                path: userName
                value_template: "{{ quote fakerName }}"
              - operation: set
                path: userId
                value_template: "{{ randomInt 0 1000000000}}"
        - name: Json
          params:
            column: sms
            operations:
              - operation: set
                path: senderName
                value: null
              - operation: set
                path: senderDetails
                value: null
        - name: Json
          params:
            column: registrationData
            operations:
              - operation: set
                path: sourceDetail
                value: null
              - operation: set
                path: marketToolOther
                value: null

    - schema: public
      name: user_structure
      transformers:
        - name: RandomPerson
          params:
            columns:
              - name: prenom
                template: "{{ .FirstName }}"
              - name: nom
                template: "{{ .LastName }}"
        - name: TemplateRecord
          params:
            columns:
              - "email"
            template: |
              {{ .SetColumnValue "email" (printf "%v-%v-%v@domifa-fake.fabrique.social.gouv.fr" (.GetColumnValue "role") (.GetColumnValue "structureId") (.GetColumnValue "id")) }}
        - name: Replace
          params:
            column: password
            value: "$2b$10$a03v2pqxniae1zkRzupgQer.k0sQKd7W/50LhiYcbuw18sikL3RV2"
        - name: SetNull
          params:
            column: fonctionDetail
        - name: Json
          params:
            column: decision
            operations:
              - operation: set
                path: motifDetails
                value: null
              - operation: set
                path: userName
                value_template: "{{ quote fakerName }}"
              - operation: set
                path: userId
                value_template: "{{ randomInt 0 1000000000}}"
    - schema: public
      name: user_supervisor
      transformers:
        - name: RandomPerson
          params:
            columns:
              - name: prenom
                template: "{{ .FirstName }}"
              - name: nom
                template: "{{ .LastName }}"
        - name: TemplateRecord
          params:
            columns:
              - "email"
            template: |
              {{ .SetColumnValue "email" (printf "%v-%v@domifa-fake.fabrique.social.gouv.fr" (.GetColumnValue "role") (.GetColumnValue "id")) }}
        - name: Replace
          params:
            column: password
            value: "$2b$10$a03v2pqxniae1zkRzupgQer.k0sQKd7W/50LhiYcbuw18sikL3RV2"
        - name: Json
          params:
            column: decision
            operations:
              - operation: set
                path: motifDetails
                value: null
              - operation: set
                path: userName
                value_template: "{{ quote fakerName }}"
              - operation: set
                path: userId
                value_template: "{{ randomInt 0 1000000000}}"
    - schema: public
      name: user_usager
      transformers:
        - name: Replace
          params:
            column: password
            value: ""
        - name: Replace
          params:
            column: salt
            value: ""
        - name: Json
          params:
            column: lastPasswordResetStructureUser
            operations:
              - operation: set
                path: userId
                value_template: "{{ randomInt 0 1000000000}}"
              - operation: set
                path: userName
                value_template: "{{ quote fakerName }}"
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/user-usager--login.js"
            columns:
              - name: "login"
                skip_on_null_input: true
              - name: "id"
                not_affected: true
                skip_on_null_input: true

    - schema: public
      name: interactions
      transformers:
        - name: Replace
          params:
            column: content
            value: "Random content"
        - name: "Template"
          params:
            column: "userName"
            template: |
              {{ quote fakerName }}
        - name: "Template"
          params:
            column: "userId"
            template: |
              {{ randomInt 1 1000000 }}

    - schema: public
      name: usager_options_history
      transformers:
        - name: RandomPerson
          params:
            columns:
              - name: prenom
                template: "{{ .FirstName }}"
              - name: nom
                template: "{{ .LastName }}"
        - name: "Template"
          params:
            column: "userName"
            template: |
              {{ quote fakerName }}
        - name: "Template"
          params:
            column: "userId"
            template: |
              {{ randomInt 1 1000000 }}
        - name: RealAddress
          params:
            columns:
              - name: adresse
                template: "{{.Address}}"
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/usager-options-history--dates.js"
            columns:
              - name: "dateNaissance"
                skip_on_null_input: true
              - name: "dateDebut"
                skip_on_null_input: true
              - name: "dateFin"
                skip_on_null_input: true

    - schema: public
      name: usager_docs
      transformers:
        - name: RandomSentence
          params:
            column: label
            keep_null: true
        - name: SetNull
          params:
            column: encryptionContext
        - name: SetNull
          params:
            column: encryptionVersion
        - name: RandomPerson
          params:
            columns:
              - name: createdBy
                template: "{{ .FirstName }} {{ .LastName }}"

    - schema: public
      name: usager_entretien
      transformers:
        - name: SetNull
          params:
            column: commentaires
        - name: SetNull
          params:
            column: revenusDetail
        - name: SetNull
          params:
            column: orientationDetail
        - name: SetNull
          params:
            column: liencommuneDetail
        - name: SetNull
          params:
            column: residenceDetail
        - name: SetNull
          params:
            column: causeDetail
        - name: SetNull
          params:
            column: raisonDetail
        - name: SetNull
          params:
            column: situationProDetail
        - name: SetNull
          params:
            column: accompagnementDetail
        - name: SetNull
          params:
            column: rattachement

    - schema: public
      name: user_structure_security
      transformers:
        - name: SetNull
          params:
            column: temporaryTokens
        - name: SetNull
          params:
            column: fingerprintHash
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/user-security--sessions.js"
            columns:
              - name: "currentSession"
                skip_on_null_input: true
              - name: "sessionsHistory"
                skip_on_null_input: true

    - schema: public
      name: user_supervisor_security
      transformers:
        - name: SetNull
          params:
            column: temporaryTokens
        - name: SetNull
          params:
            column: fingerprintHash
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/user-security--sessions.js"
            columns:
              - name: "currentSession"
                skip_on_null_input: true
              - name: "sessionsHistory"
                skip_on_null_input: true

    - schema: public
      name: user_usager_security
      transformers:
        - name: SetNull
          params:
            column: temporaryTokens
        - name: SetNull
          params:
            column: fingerprintHash
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/user-security--sessions.js"
            columns:
              - name: "currentSession"
                skip_on_null_input: true
              - name: "sessionsHistory"
                skip_on_null_input: true

    - schema: public
      name: app_log_security
      # Retention window. No foreign key on this table, so no propagation.
      subset_conds:
        - 'public.app_log_security."createdAt" > now() - interval ''6 months'''
      transformers:
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/app-log-security--all-columns.js"
            columns:
              - name: "ip"
                skip_on_null_input: true
              - name: "userAgent"
                skip_on_null_input: true
              - name: "userName"
                skip_on_null_input: true
              - name: "context"
                skip_on_null_input: true

    - schema: public
      name: app_log
      # Retention window. No foreign key on this table, so no propagation.
      subset_conds:
        - 'public.app_log."createdAt" > now() - interval ''6 months'''
      transformers:
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/app-log--all-columns.js"
            columns:
              - name: "userName"
                skip_on_null_input: true
              - name: "createdBy"
                skip_on_null_input: true
              - name: "context"
                skip_on_null_input: true

    - schema: public
      name: app_ip_ban
      transformers:
        - name: SetNull
          params:
            column: context
        - name: "Cmd"
          params:
            driver:
              name: "json"
            validate: true
            timeout: 3600s
            expected_exit_code: -1
            executable: "node"

            args:
              - "./dist/app-ip-ban--all-columns.js"
            columns:
              - name: "ip"
                skip_on_null_input: true
              - name: "sources"
                skip_on_null_input: true
              - name: "uuid"
                not_affected: true
                skip_on_null_input: true

    - schema: public
      name: otp
      transformers:
        - name: "Template"
          params:
            column: "email"
            template: |
              {{ printf "otp-%s@domifa-fake.fabrique.social.gouv.fr" (fakerUUID) }}
        - name: "Template"
          params:
            column: "fingerprintHash"
            template: |
              {{ quote fakerUUID }}

    - schema: public
      name: message_sms
      transformers:
        - name: RegexpReplace
          params:
            column: status
            replace: "DISABLED"
            regexp: "TO_SEND"
        - name: Replace
          params:
            column: phoneNumber
            value: "+33606060606"
            keep_null: true
        - name: Replace
          params:
            column: responseId
            value: ""
            keep_null: true
        - name: Replace
          params:
            column: content
            value: ""
            keep_null: true
        - name: Replace
          params:
            column: senderName
            value: ""
            keep_null: true
        - name: SetNull
          params:
            column: errorMessage
        - name: SetNull
          params:
            column: reminderMetas
        - name: SetNull
          params:
            column: interactionMetas

    - schema: public
      name: usager_notes
      transformers:
        - name: RandomSentence
          params:
            column: message
            keep_null: true
        - name: TemplateRecord
          params:
            columns:
              - "createdBy"
              - "archivedBy"
            template: |
              {{ .SetColumnValue "createdBy" (printf "{\"userId\": %v, \"userName\": %q}" (randomInt 1 1000000) fakerName) }}
              {{ if .GetColumnValue "archived" }}{{ .SetColumnValue "archivedBy" (printf "{\"userId\": %v, \"userName\": %q}" (randomInt 1 1000000) fakerName) }}{{ end }}

    - schema: public
      name: structure_doc
      transformers:
        - name: RandomSentence
          params:
            column: label
            keep_null: true
        - name: SetNull
          params:
            column: encryptionContext
        - name: SetNull
          params:
            column: encryptionVersion
        - name: Json
          params:
            column: createdBy
            operations:
              - operation: set
                path: id
                value_template: "{{ randomInt 0 1000000000}}"
              - operation: set
                path: nom
                value_template: "{{ quote fakerFirstLastName }}"
              - operation: set
                path: prenom
                value_template: "{{ quote fakerFirstName }}"

    - schema: public
      name: structure_information
      transformers:
        - name: RandomSentence
          params:
            column: title
            keep_null: true
        - name: RandomSentence
          params:
            column: description
            keep_null: true
        - name: Json
          params:
            column: createdBy
            operations:
              - operation: set
                path: userId
                value_template: "{{ randomInt 0 1000000000}}"
              - operation: set
                path: userName
                value_template: "{{ quote fakerName }}"

    - schema: public
      name: structure_stats_reporting
      transformers:
        - name: Json
          params:
            column: completedBy
            operations:
              - operation: set
                path: id
                value_template: "{{ randomInt 0 1000000000}}"
              - operation: set
                path: nom
                value_template: "{{ quote fakerFirstLastName }}"
              - operation: set
                path: prenom
                value_template: "{{ quote fakerFirstName }}"
