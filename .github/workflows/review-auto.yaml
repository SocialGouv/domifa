            DOMIFA_PORTAIL_STATS_URL=https://${{ steps.env.outputs.subdomain_pilotage }}.ovh.fabrique.social.gouv.fr/
            DOMIFA_SENTRY_DSN_PORTAIL_ADMIN=https://dc9ede612eba2fcb6abf404bd44b9b3b@sentry2.fabrique.social.gouv.fr/11
          push: true

  build-portail-stats:
    permissions:
      contents: read
      id-token: write # OIDC identity for buildkit-operator /route auth
    environment: build-review-auto
