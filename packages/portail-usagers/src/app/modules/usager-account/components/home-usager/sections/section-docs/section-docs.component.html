<h2 class="fr-text-title--blue-france fr-mb-1w">Documents disponibles</h2>

<div
  class="border-top fr-pt-2w border-1 border-grey fr-display-flex fr-flex-column fr-gap-2"
>
  @if (!docs.length) {
  <div>
    <div class="fr-callout fr-callout--empty">
      Vous n'avez aucun document disponible
    </div>
  </div>
  } @else { @for (doc of docs; track doc.uuid) {
  <div class="fr-card fr-card--download fr-enlarge-link fr-card--sm">
    <div class="fr-card__body">
      <div class="fr-card__content">
        <h3 class="fr-card__title fr-h5 fr-mb-0">
          <button
            type="button"
            [disabled]="doc.loading"
            [attr.aria-disabled]="doc.loading"
            [attr.aria-busy]="doc.loading ? 'true' : 'false'"
            [attr.aria-label]="'Télécharger le document ' + doc.label"
            (click)="downloadDoc(doc)"
          >
            {{ doc.label }}
            @if (doc.loading) { - Téléchargement en cours }
          </button>
        </h3>
        <!-- the spinner renders block elements, not allowed inside a heading or a button -->
        @if (doc.loading) {
        <dsfr-ext-spinner typeLoader="quarter"></dsfr-ext-spinner>
        }
        <p class="fr-card__desc">
          Date d'ajout : {{ doc.createdAt | date : "short" }}
        </p>
        <div class="fr-card__end">
          <p class="fr-card__detail">
            {{ STRUCTURE_DOC_EXTENSIONS_LABELS[doc.filetype] }}
          </p>
        </div>
      </div>
    </div>
  </div>
  } }
</div>
