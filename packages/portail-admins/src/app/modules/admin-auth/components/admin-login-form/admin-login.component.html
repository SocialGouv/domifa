<h1 class="fr-h3 fr-mb-2w">DomiFa - Accès institutionnel</h1>
<p class="fr-text--xs fr-text-default--error fr-mb-3w">* champs obligatoires</p>
<form
  [formGroup]="loginForm"
  class="fr-display-flex fr-flex-column fr-gap-3"
  (ngSubmit)="login()"
>
  <div
    [class.fr-input-group--error]="f.email.dirty && f.email.errors"
    class="fr-input-group fr-mb-0 required"
  >
    <label class="fr-label" for="email">Identifiant</label>
    <p class="fr-hint-text">Format attendu : nom&#64;domaine.fr</p>
    <input
      type="email"
      formControlName="email"
      id="email"
      name="email"
      autocomplete="email"
      class="fr-input"
      [attr.aria-invalid]="f.email.dirty && f.email.errors ? true : false"
      [attr.aria-describedby]="
        f.email.dirty && f.email.errors ? 'email-errors' : null
      "
    />
    @if (f.email.dirty && f.email.errors) {
    <p id="email-errors" class="fr-error-text">Veuillez vérifier l'email</p>
    }
  </div>
  <div
    [class.fr-input-group--error]="f.password.dirty && f.password.errors"
    class="fr-input-group fr-mb-0 required"
  >
    <div class="fr-password" id="passwordContainer">
      <label class="fr-password__label fr-label" for="password">
        Mot de passe
      </label>
      <div class="fr-input-wrap">
        <input
          formControlName="password"
          id="password"
          name="password"
          [type]="!hidePassword ? 'text' : 'password'"
          class="fr-input"
          autocomplete="current-password"
          [attr.aria-invalid]="
            f.password.dirty && f.password.errors ? true : false
          "
          [attr.aria-describedby]="
            f.password.dirty && f.password.errors ? 'invalid-password' : null
          "
        />
        @if (f.password.dirty && f.password.errors) {
        <p id="invalid-password" class="fr-error-text">
          Veuillez vérifier le mot de passe
        </p>
        }
      </div>
      <div
        class="fr-password__checkbox fr-checkbox-group fr-checkbox-group--sm"
      >
        <input
          id="show-password"
          type="checkbox"
          class="fr-checkbox"
          role="switch"
          [attr.aria-checked]="!hidePassword"
          (change)="toggleShowPassword()"
        />
        <label class="fr--password__checkbox fr-label" for="show-password">
          Afficher
        </label>
      </div>
    </div>
  </div>
  <div>
    <a routerLink="/auth/reset-password" class="fr-link">
      Mot de passe oublié ?
    </a>
  </div>
  <app-button
    type="submit"
    label="Se connecter"
    loadingText="Connexion en cours..."
    customClass="fr-display-flex fr-flex-column w-100"
    [loading]="loading"
  ></app-button>
</form>
