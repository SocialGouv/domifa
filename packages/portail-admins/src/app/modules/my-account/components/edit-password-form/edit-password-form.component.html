<form [formGroup]="passwordForm" (ngSubmit)="submit()">
  <div class="fr-grid-row fr-grid-row--gutters">
    <div class="fr-col-12">
      <div class="fr-password">
        <label class="fr-label" for="oldPassword">Ancien mot de passe</label>
        <div class="fr-input-wrap">
          <input
            class="fr-password__input fr-input"
            [type]="!hideOldPassword ? 'text' : 'password'"
            [class.fr-input--error]="
              p.oldPassword.dirty && p.oldPassword.errors
            "
            id="oldPassword"
            formControlName="oldPassword"
            name="oldPassword"
            autocomplete="current-password"
            required
          />
        </div>
        <div
          class="fr-password__checkbox fr-checkbox-group fr-checkbox-group--sm"
        >
          <input
            type="checkbox"
            id="toggle-old-password"
            [checked]="!hideOldPassword"
            (change)="toggleOldPassword()"
            aria-label="Afficher l'ancien mot de passe"
          />
          <label
            class="fr-password__checkbox fr-label"
            for="toggle-old-password"
          >
            Afficher
          </label>
        </div>
      </div>
      @if (passwordForm.errors?.samePassword && (p.password.dirty || submitted))
      {
      <p class="fr-error-text">
        Le nouveau mot de passe doit être différent de l'ancien mot de passe
      </p>
      }
    </div>
    <div class="fr-col-12">
      <app-user-supervisor-password-form
        [parentFormGroup]="passwordForm"
        [submitted]="submitted"
      ></app-user-supervisor-password-form>
    </div>
  </div>

  <div
    class="fr-btns-group fr-btns-group--right fr-btns-group--inline-reverse fr-btns-group--inline-lg fr-mt-3w"
  >
    <app-button
      type="submit"
      [loading]="loading"
      label="Enregistrer les changements"
    ></app-button>
    <button type="button" class="fr-btn fr-btn--secondary" (click)="onCancel()">
      {{ cancelLabel }}
    </button>
  </div>
</form>
