<div class="fr-container fr-py-6w">
  <div class="fr-grid-row fr-grid-row--center">
    <div
      class="fr-col-12 fr-col-md-8 fr-col-lg-6 fr-background-alt--grey fr-px-3w fr-py-5w fr-px-md-5w fr-py-md-6w"
    >
      <h1 class="fr-h3 fr-mb-2w">
        Il est temps de renouveler votre mot de passe
      </h1>
      <p class="fr-mb-2w">
        Pour des questions de sécurité il est recommandé de modifier votre mot
        de passe régulièrement.
      </p>
      <p class="fr-text--xs fr-text-default--error fr-mb-3w">
        * champs obligatoires
      </p>
      <app-edit-password-form
        cancelLabel="Se déconnecter"
        (success)="onSuccess()"
        (cancelled)="logout()"
      ></app-edit-password-form>
    </div>
  </div>
</div>
