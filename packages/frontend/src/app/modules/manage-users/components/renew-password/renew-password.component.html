<div class="fr-container">
  <div class="fr-grid-row" style="min-height: 700px">
    <div
      class="fr-col-12 fr-col-md-5 fr-p-3w fr-background-alt--grey fr-display-flex fr-flex-column fr-justify-content-center"
    >
      <h1 class="fr-h3">Il est temps de renouveler votre mot de passe</h1>
      <p>
        Pour des questions de sécurité il est recommandé de modifier votre mot
        de passe régulièrement.
      </p>
      <div class="fr-fieldset__element fr-pl-0">
        <span class="fr-hint-text"
          >Sauf mention contraire, tous les champs sont obligatoires.</span
        >
      </div>
      <app-edit-password-form
        cancelLabel="Se déconnecter"
        (success)="onSuccess()"
        (cancelled)="logout()"
      >
      </app-edit-password-form>
    </div>
    <div
      class="fr-col-12 fr-col-md-7 fr-p-3w fr-hidden fr-unhidden-md fr-display-flex fr-flex-column fr-justify-content-center fr-align-items-center"
    >
      <img src="assets/images/logo.svg" alt="" style="max-width: 240px" />
      <p
        class="fr-text-title--blue-france fr-text--bold fr-mt-3w fr-text--center"
      >
        Votre outil de gestion pour simplifier la domiciliation
      </p>
      <img
        aria-hidden="true"
        class="fr-responsive-img"
        src="assets/images/login/login-container.svg"
        alt=""
        style="max-width: 600px"
      />
    </div>
  </div>
</div>
