<div class="fr-content-container-light">
  <app-profil-head
    [usager]="usager"
    [section]="section"
    *ngIf="me"
    [me]="me"
  ></app-profil-head>
  <div class="fr-container" *ngIf="usager">
    <div class="fr-content">
      <div
        class="fr-display-flex fr-my-3w d-print-none fr-justify-content-between fr-align-items-center"
      >
        <h2 class="fr-my-0 fr-h3">
          <span class="fr-icon-time-line" aria-hidden="true"></span>Historique
          du dossier
        </h2>
        <button
          type="button"
          class="fr-btn fr-btn--secondary d-print-none"
          (click)="goToPrint()"
        >
          <span class="fr-icon-printer-line fr-mr-1w" aria-hidden="true"></span>
          Imprimer
        </button>
      </div>

      <nav
        class="history-tabs fr-mb-4w d-print-none"
        aria-label="Sections de l'historique"
      >
        <ul class="history-tabs__list" role="list">
          <li *ngFor="let section of sections">
            <a
              [id]="'tab-' + section.id"
              class="history-tabs__tab"
              [routerLink]="[
                '/profil/historique/' + usager.ref + '/' + section.id
              ]"
              routerLinkActive
              ariaCurrentWhenActive="page"
            >
              {{ section.name }}
            </a>
          </li>
        </ul>
      </nav>

      <div class="fr-grid-row">
        <div
          class="fr-col-md-12"
          id="tabpanel-decisions"
          [attr.aria-labelledby]="'tab-decisions'"
          [hidden]="currentSection !== 'decisions'"
        >
          <app-profil-historique-decisions
            [usager]="usager"
            [me]="me"
          ></app-profil-historique-decisions>
        </div>
        <div
          class="fr-col-md-12"
          id="tabpanel-interactions"
          [attr.aria-labelledby]="'tab-interactions'"
          [hidden]="currentSection !== 'interactions'"
        >
          <app-profil-historique-courriers
            [usager]="usager"
            [me]="me"
          ></app-profil-historique-courriers>
        </div>
        <div
          class="fr-col-md-12"
          id="tabpanel-procurations"
          [attr.aria-labelledby]="'tab-procurations'"
          [hidden]="currentSection !== 'procurations'"
        >
          <app-profil-historique-procurations
            [me]="me"
            [usager]="usager"
          ></app-profil-historique-procurations>
        </div>

        <div
          class="fr-col-md-12"
          id="tabpanel-transferts"
          [attr.aria-labelledby]="'tab-transferts'"
          [hidden]="currentSection !== 'transferts'"
        >
          <app-profil-historique-transferts
            *ngIf="currentSection === 'transferts'"
            [me]="me"
            [usager]="usager"
          ></app-profil-historique-transferts>
        </div>
        <div
          class="fr-col-md-12"
          id="tabpanel-sms"
          [attr.aria-labelledby]="'tab-sms'"
          [hidden]="currentSection !== 'sms'"
          *ngIf="
            me.structure.sms.enabledByDomifa &&
            me.structure.sms.enabledByStructure
          "
        >
          <app-profil-historique-sms
            [usager]="usager"
            [me]="me"
          ></app-profil-historique-sms>
        </div>

        <div
          class="fr-col-md-12"
          id="tabpanel-notes"
          [attr.aria-labelledby]="'tab-notes'"
          [hidden]="currentSection !== 'notes'"
        >
          <app-profil-historique-notes
            [me]="me"
            [usager]="usager"
          ></app-profil-historique-notes>
        </div>
        <div
          class="fr-col-md-12"
          id="tabpanel-login-portail"
          [attr.aria-labelledby]="'tab-login-portail'"
          [hidden]="currentSection !== 'login-portail'"
          *ngIf="
            me.structure.portailUsager.enabledByDomifa &&
            me.structure.portailUsager.enabledByStructure
          "
        >
          <app-profil-historique-login-portail
            [usager]="usager"
            [me]="me"
          ></app-profil-historique-login-portail>
        </div>
      </div>
    </div>

    <app-delete-usager-menu
      [usager]="usager"
      [me]="me"
      context="PROFIL"
      *ngIf="displayDeleteButton"
    ></app-delete-usager-menu>
  </div>
</div>
