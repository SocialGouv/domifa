<div class="fr-container fr-py-6w text-center">
  <ng-container *ngIf="!error">
    <p>Activation du mode support en cours...</p>
  </ng-container>
  <ng-container *ngIf="error">
    <p class="fr-error-text">
      Lien de mode support invalide ou expiré. Merci de relancer l'activation
      depuis le portail d'administration.
    </p>
  </ng-container>
</div>
