packages:
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  aws-sdk: true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  sharp: true

engineStrict: true

hoist: true

nodeVersion: 22.22.0

sharedWorkspaceLockfile: true
